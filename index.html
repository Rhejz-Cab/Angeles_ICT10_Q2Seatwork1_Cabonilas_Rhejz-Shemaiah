
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCC Candidate Verification System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e4eddf, #f5f7f0);
            font-family: Arial, sans-serif;
            color: #405744;
        }

        .main-card {
            max-width: 480px;
            margin: 70px auto;
            padding: 35px;
            background: #fffefb;
            border: 1px solid #d3dfce;
            border-top: 5px solid #8da98a;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(64, 87, 68, 0.12);
        }

        .subtitle {
            color: #82927e;
            font-size: 14px;
        }

        .form-label {
            color: #506b53;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border: 1px solid #cfdcc9;
            border-radius: 9px;
            background: #fafcf8;
        }

        .form-control:focus {
            border-color: #8da98a;
            box-shadow: 0 0 0 3px rgba(141, 169, 138, 0.2);
        }

        .check-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #819e80;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .check-button:hover {
            background: #69876b;
            color: white;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 9px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e1e8dc;
            color: #8a9b87;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 576px) {
            .main-card {
                margin: 30px auto;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="main-card">

            <p class="text-center text-uppercase mb-2"
               style="color: #819e80; letter-spacing: 3px; font-size: 11px;">
                ICT 10 • SEATWORK #1
            </p>

            <h2 class="text-center fw-bold">COCC Member Checker</h2>

            <p class="subtitle text-center mt-3 mb-4">
                Candidate Verification System<br>
                Enter your name to verify your membership.
            </p>

            <div class="mb-3">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" id="first_name"
                       class="form-control" placeholder="Enter your first name">
            </div>

            <div class="mb-4">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" id="last_name"
                       class="form-control" placeholder="Enter your last name">
            </div>

            <button type="button" class="btn check-button"
                    py-click="check_candidate">
                CHECK MEMBERSHIP
            </button>

            <div id="result" class="result-box text-center"
                 role="status"></div>

            <div class="footer">
                COCC • CANDIDATE VERIFICATION SYSTEM
            </div>

        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
